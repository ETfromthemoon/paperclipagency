# Extensión Paperclip (sidecar) para Strimo.cl — ARRANQUE MÍNIMO.
# Solo el CEO. Sin rutinas (cron) por prudencia. Presupuestos en centavos USD.
# El freno por presupuesto auto-pausa al agente al 100%.
schema: paperclip/v1

# Presupuesto mensual de la empresa: USD 150 (= 15000 centavos). Ajústalo cuando haya resultados.
budgetMonthlyCents: 15000

agents:
  ceo:
    adapter:
      type: claude_local
      # 'cwd' (directorio de trabajo) y 'model' se configuran en el despliegue/UI,
      # NO se versionan aquí (son específicos de la máquina). Ver deploy/PRODUCTION.md.
      # config:
      #   model: <tu-modelo-claude-preferido>
      #   maxTurnsPerRun: 60   # bájalo para limitar gasto por heartbeat
    budgetMonthlyCents: 12000
    inputs:
      env:
        ANTHROPIC_API_KEY:
          kind: secret
          requirement: optional
          default: ""

# Sin 'routines': los heartbeats programados se activan más tarde desde la UI,
# cuando confíes en el agente. Para probar, usa "Invoke" (heartbeat manual).
